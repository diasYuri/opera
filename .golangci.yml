version: "2"
run:
  timeout: 5m
  tests: true
linters:
  default: none
  enable:
    - govet
    - staticcheck
    - unused
    - errcheck
    - errorlint
    - nilerr
    - durationcheck
    - ineffassign
    - bidichk
    - bodyclose
    - nolintlint
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
